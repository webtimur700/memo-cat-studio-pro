[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-cat-studio-pro"
version = "0.1.0"
description = "Локальная AI-студия для автоматической нарезки вирусных YouTube Shorts из видео с животными"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Memo Cat AI Studio" }]

# ВАЖНО: версии зафиксированы намеренно (не "*", не "latest"), чтобы сборка
# на конкретной машине (Ryzen 7 8845HS / Radeon 780M / Bazzite) была воспроизводимой.
dependencies = [
    # --- UI ---
    "PySide6==6.7.2",

    # --- Video / Audio I/O ---
    "opencv-python-headless==4.10.0.84",
    "scenedetect==0.6.4",
    "ffmpeg-python==0.2.0",

    # --- Vision (ONNX Runtime — CPU EP гарантированно работает на этой машине;
    #     Vulkan/ROCm EP пробуются в рантайме, если бинарник onnxruntime собран с ними —
    #     см. честный комментарий в vision/compute_backend.py на Шаге 6) ---
    "onnxruntime==1.19.2",
    "ultralytics==8.3.28",              # используется для экспорта YOLO11 в ONNX, не для инференса
    "mediapipe==0.10.14",

    # --- Audio ---
    "faster-whisper==1.0.3",
    "silero-vad==5.1.2",
    "librosa==0.10.2",                  # мел-спектрограммы для event_classifier (лай/мяу/смех)

    # --- LLM client ---
    "httpx==0.27.2",                    # HTTP-клиент к LM Studio / Ollama API

    # --- Core / DI / Data ---
    "dependency-injector==4.42.0",
    "pydantic==2.9.2",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.35",               # тонкий слой поверх sqlite3 для Repository Pattern

    # --- Утилиты ---
    "numpy==1.26.4",
    "pillow==10.4.0",
    "loguru==0.7.2",                    # структурированные логи (Функция 20)
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.7.1",
    "mypy==1.13.0",
]

[project.scripts]
memo-cat-studio = "ui.main_window:main"

[tool.setuptools.packages.find]
include = ["core*", "ui*", "video*", "vision*", "audio*", "scoring*",
           "cutting*", "subtitles*", "llm*", "effects*", "animation*",
           "export*", "queue*", "plugins*", "database*", "workers*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
