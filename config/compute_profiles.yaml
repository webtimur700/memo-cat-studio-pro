# Конфигурация ComputeBackend (core/interfaces/compute_backend.py, реализация в vision/compute_backend.py).
#
# ЧЕСТНОЕ ПРИМЕЧАНИЕ (важно прочитать перед тем как менять этот файл):
# Официальный pip-пакет `onnxruntime` для x86_64 Linux не включает Vulkan Execution
# Provider "из коробки" — он есть только в отдельных сборках (onnxruntime собранный
# из исходников с флагом --use_vulkan, либо через onnxruntime-genai для отдельных
# сценариев). ROCm EP официально поддерживает ограниченный список GPU и НЕ гарантирует
# gfx1103 (Radeon 780M, iGPU). Поэтому:
#   - "vulkan" и "rocm" ниже помечены как OPTIONAL и ПРОВЕРЯЮТСЯ в рантейме
#     (scripts/check_gpu_support.py) — если EP недоступен, backend молча падает
#     на следующий по списку, приложение не падает и не врёт пользователю в логах,
#     что "GPU используется", если это не так.
#   - Реалистичный основной путь на этой машине — CPU EP с полной многопоточностью
#     (16 потоков 8845HS) + INT8-квантизация моделей. Это и есть "default" профиль.
#   - VAAPI используется ТОЛЬКО для видео-декодирования/энкодирования через FFmpeg,
#     не для ML-инференса — это отдельный, реально работающий и надёжный путь ускорения.

active_profile: default

profiles:
  default:
    description: >
      Безопасный профиль. GPU-EP пробуются, но приложение не рассчитывает на них
      как на обязательное условие производительности.
    inference_backend_priority: [vulkan, rocm, opencl, cpu]
    video_hwaccel: vaapi          # FFmpeg -hwaccel vaapi, fallback на software encode
    cpu_threads: auto             # auto = os.cpu_count() (16 на 8845HS)
    onnx_intra_op_threads: 8
    onnx_inter_op_threads: 2
    whisper_compute_type: int8
    max_parallel_video_workers: auto   # auto = cpu_threads - 2

  cpu_only:
    description: "Форсированный CPU-режим — для диагностики или если GPU-драйверы нестабильны."
    inference_backend_priority: [cpu]
    video_hwaccel: none
    cpu_threads: auto
    onnx_intra_op_threads: 12
    onnx_inter_op_threads: 4
    whisper_compute_type: int8
    max_parallel_video_workers: auto

  experimental_gpu:
    description: >
      Агрессивная попытка задействовать iGPU везде, где технически возможно.
      Использовать только если scripts/check_gpu_support.py подтвердил
      реальную (не предполагаемую) поддержку нужных EP на этой системе.
    inference_backend_priority: [rocm, vulkan, opencl, cpu]
    video_hwaccel: vaapi
    cpu_threads: auto
    onnx_intra_op_threads: 4
    onnx_inter_op_threads: 2
    whisper_compute_type: int8
    max_parallel_video_workers: auto

detection:
  # Команды/проверки, которые scripts/check_gpu_support.py реально выполняет
  # перед тем как разрешить профиль с GPU EP (а не просто "if platform == linux").
  vaapi_check_cmd: "vainfo"
  rocm_check_cmd: "rocminfo"
  vulkan_check_cmd: "vulkaninfo --summary"
  recheck_on_startup: true
